<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student_list</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
</head>

<body>
    <h2>student_list</h2>
    {% if students %}
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Emails</th>
                <th>City</th>
            </tr>
        </thead>

        <tbody>
            {% for student in students %}
            <tr>
                <td>{{student.name}}</td>
                <td>{{student.age}}</td>
                <td>{{student.email}}</td>
                <td>{{student.city}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
        <p>No Students data available.</p>
    {% endif %}
</body>

</html>
